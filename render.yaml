services:
  # Frontend - Static Site
  - type: web
    name: sistema-licitacao-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    # SPA: todas as rotas (incl. /redefinir-senha do link do e-mail) devem servir index.html
    routes:
      - type: rewrite
        source: /redefinir-senha
        destination: /index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false

  # Cron: dispara alerta WhatsApp diário (chama a Edge Function no horário)
  # Roda a cada hora (UTC); a Edge Function usa horário Brasil e processa só alertas do minuto atual.
  - type: cron
    name: alerta-whatsapp-diario
    env: node
    schedule: "0 * * * *"
    buildCommand: npm install
    startCommand: node scripts/trigger-alerta-whatsapp.js
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false

