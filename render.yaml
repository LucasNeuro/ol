services:
  # Frontend - Static Site
  - type: web
    name: sistema-licitacao-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false

  # Cron: dispara alertas WhatsApp e E-mail (chama as Edge Functions no horário)
  # Roda a cada 15 min (UTC); as Edge Functions usam horário Brasil e processam alertas do horário atual.
  - type: cron
    name: alertas-diarios
    env: node
    schedule: "*/15 * * * *"
    buildCommand: npm install
    startCommand: node scripts/trigger-alertas.js
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false

  # Cron: classifica licitações por setor/UF e grava em licitacoes_por_setor (usa mesma lógica do filtro semântico)
  - type: cron
    name: classificar-licitacoes-por-setor
    env: node
    schedule: "0 * * * *"
    buildCommand: npm install
    startCommand: node scripts/classificar-licitacoes-por-setor.js 7
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
